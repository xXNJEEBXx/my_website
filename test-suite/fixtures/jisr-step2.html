<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>استمارة التقديم — منصة جسر (الخطوة 2: معلومات إضافية والملفات)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; padding: 20px; direction: rtl; }
    .card { max-width: 680px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    input[type="text"] { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    .select__control { border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px 12px; display: flex; align-items: center; cursor: pointer; }
    .select__menu { border: 1px solid #cbd5e1; background: white; border-radius: 6px; margin-top: 4px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); max-height: 150px; overflow-y: auto; }
    .select__option { padding: 8px 12px; cursor: pointer; }
    .select__option:hover { background: #eff6ff; }
    .dropzone { border: 2px dashed #cbd5e1; border-radius: 8px; padding: 24px; text-align: center; background: #f8fafc; cursor: pointer; }
    .radio-group { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
    .radio-label { display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer; }
    .btn { background: #0f172a; color: white; padding: 12px 30px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>معلومات إضافية</h2>
    <form id="jisr-step2-form">
      <div class="form-group">
        <label for="candidate_profile_current_role">المسمى الوظيفي الحالي *</label>
        <input type="text" id="candidate_profile_current_role" name="candidate_profile[current_role]">
      </div>
      <div class="form-group">
        <label for="candidate_profile_city">المدينة *</label>
        <input type="text" id="candidate_profile_city" name="candidate_profile[city]">
      </div>
      <div class="form-group">
        <label for="candidate_profile_address">العنوان *</label>
        <input type="text" id="candidate_profile_address" name="candidate_profile[address]">
      </div>

      <!-- React Select Nationality -->
      <div class="form-group">
        <label>الجنسية *</label>
        <div class="select__control" id="nationality-control">
          <input type="text" id="react-select-2-input" placeholder="Select..." style="border:none; outline:none; width:100%;">
        </div>
        <div class="select__menu" id="nationality-menu" style="display:none;">
          <div class="select__option" id="react-select-2-option-0">Non-Saudi</div>
          <div class="select__option" id="react-select-2-option-1">Saudi Arabia</div>
          <div class="select__option" id="react-select-2-option-2">Kuwait</div>
        </div>
      </div>

      <!-- React Select Country -->
      <div class="form-group">
        <label>الدولة *</label>
        <div class="select__control" id="country-control">
          <input type="text" id="react-select-3-input" placeholder="Select..." style="border:none; outline:none; width:100%;">
        </div>
        <div class="select__menu" id="country-menu" style="display:none;">
          <div class="select__option" id="react-select-3-option-0">United Arab Emirates</div>
          <div class="select__option" id="react-select-3-option-1">Saudi Arabia</div>
          <div class="select__option" id="react-select-3-option-2">Bahrain</div>
        </div>
      </div>

      <!-- CV Dropzone -->
      <div class="form-group">
        <label>السيرة الذاتية *</label>
        <div class="dropzone" id="cv-dropzone" role="presentation">
          <p>اختر ملفًا للتحميل أو اسحبه وأفلته هنا (PDF حتى 10 ميجابايت)</p>
          <input type="file" id="cv-file-input" accept=".pdf,.doc,.docx" style="display:none;">
        </div>
      </div>

      <!-- Certificate Dropzone -->
      <div class="form-group">
        <label>إرفاق شهادة دورة أخصائي النمو *</label>
        <div class="dropzone" id="cert-dropzone" role="presentation">
          <p>اختر ملفًا للتحميل أو اسحبه وأفلته هنا</p>
          <input type="file" id="cert-file-input" accept=".pdf,.doc,.docx" style="display:none;">
        </div>
      </div>

      <!-- Screening Questions -->
      <h3>أسئلة الفحص</h3>
      <div class="form-group">
        <label>مؤهل لبرنامج التدريب التعاوني؟ *</label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="q_eligible" value="نعم"> نعم</label>
          <label class="radio-label"><input type="radio" name="q_eligible" value="لا"> لا</label>
        </div>
      </div>

      <div class="form-group">
        <label>ما مدى اهتمامك بالتجارة الإلكترونية ونمو المتاجر؟ *</label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="q_interest" value="مهتم جدًا"> مهتم جدًا</label>
          <label class="radio-label"><input type="radio" name="q_interest" value="مهتم"> مهتم</label>
          <label class="radio-label"><input type="radio" name="q_interest" value="غير مهتم"> غير مهتم</label>
        </div>
      </div>

      <div class="form-group">
        <label>هل لديك حاليا متجر إلكتروني أو سبق لك إنشاء متجر إلكتروني؟ *</label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="q_store" value="نعم"> نعم</label>
          <label class="radio-label"><input type="radio" name="q_store" value="لا"> لا</label>
        </div>
      </div>

      <div style="display: flex; gap: 12px; margin-top: 30px;">
        <button type="submit" id="btn-submit-application" class="btn">إرسال</button>
        <button type="button" id="btn-prev-step" class="btn" style="background: transparent; color: #334155; border: 1px solid #cbd5e1;">السابق</button>
      </div>
    </form>
  </div>

  <script>
    // Minimal mock for React-Select menus in static preview
    ['nationality', 'country'].forEach(type => {
      const ctrl = document.getElementById(type + '-control');
      const menu = document.getElementById(type + '-menu');
      if (ctrl && menu) {
        ctrl.addEventListener('mousedown', () => { menu.style.display = 'block'; });
        menu.querySelectorAll('.select__option').forEach(opt => {
          opt.addEventListener('click', () => {
            ctrl.querySelector('input').value = opt.innerText.trim();
            menu.style.display = 'none';
          });
        });
      }
    });
  </script>
</body>
</html>
